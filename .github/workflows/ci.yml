# Generated for the reposplit micro-repo layout.
# Steps are emitted only for tooling this repo actually contains.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install (alerts/admin)
        working-directory: alerts/admin
        run: npm install
      - name: lint (alerts/admin)
        working-directory: alerts/admin
        run: npm run lint
      - name: build (alerts/admin)
        working-directory: alerts/admin
        run: npm run build
      - name: Install (services/email/webmail)
        working-directory: services/email/webmail
        run: npm install
      - name: lint (services/email/webmail)
        working-directory: services/email/webmail
        run: npm run lint
      - name: build (services/email/webmail)
        working-directory: services/email/webmail
        run: npm run build
      - name: Install (services/notifications/admin)
        working-directory: services/notifications/admin
        run: npm install
      - name: lint (services/notifications/admin)
        working-directory: services/notifications/admin
        run: npm run lint
      - name: build (services/notifications/admin)
        working-directory: services/notifications/admin
        run: npm run build
      - name: Install (services/webhooks/admin)
        working-directory: services/webhooks/admin
        run: npm install
      - name: lint (services/webhooks/admin)
        working-directory: services/webhooks/admin
        run: npm run lint
      - name: build (services/webhooks/admin)
        working-directory: services/webhooks/admin
        run: npm run build
  cpp-notifications-service:
    name: C++ notifications-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config
      - name: Configure
        working-directory: notifications-service
        run: |
          cmake -S . -B _build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        working-directory: notifications-service
        run: cmake --build _build --parallel "$(nproc)"
